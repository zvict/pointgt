eval:
  dataset:
    name: "testset"
    mode: "test"
    load_gt_sp: false
    extract_patch: false
    type: "synthetic"
    white_bg: true
    bg_color: [1.0, 1.0, 1.0]  # background color when using white_bg, values should be in [0, 1]
    path: "./data/nerf_synthetic/lego/"
    factor: 1
    num_workers: 0
    num_slices: -1  # unused in this release
  step: 5000  # evaluate the model every this number of steps
  animate_step: 20000  # unused in this release
  img_idx: 50 # index of the image to evaluate
  max_height: 100 # maximum size for each loop when rendering a full image, if the image is too large, it will be rendered in multiple loops due to memory constraints
  max_width: 100
  save_fig: true # save the log images during training
test:
  load_path: "" # path to load the model from for testing
  save_fig: true  # save the log images during testing
  save_video: false  # unused in this release
  max_height: 100
  max_width: 100
  datasets:
    - name: "testset"
      mode: "test"
      load_gt_sp: false
      extract_patch: false
      type: "synthetic"
      white_bg: true
      bg_color: [1.0, 1.0, 1.0]  # background color when using white_bg, values should be in [0, 1]
      path: "./data/nerf_synthetic/lego/"
      factor: 1
      num_workers: 0
      num_slices: -1  # unused in this release
  plots:  # unused in this release: no plot/video export is implemented
    pcrgb: true  # unused in this release
    featattn: false  # unused in this release
    rgbdepth: true  # unused in this release

# Nuvo model configuration (for texture mapping stages)
nuvo:
  model:
    hidden_dim: 256
    num_layers: 8
    c_num_layers: 8  # independent num_layers for ChartAssignmentMLP
    num_charts: 8
    use_tcnn: true
    scale_by_pi: true
    c_use_rayd: false
    c_pe_degree: 1
    t_pe_degree: 4  
    s_pe_degree: 4
    c_bias_std: 0.0
    t_bias_std: 0.1
    s_bias_std: 1.0 # !!!
    c_bias: 0.0
    t_bias: 0.5
    s_bias: 0.0
    t_last_act: None
    t_share_mlps: true
    s_share_mlps: true
  texture:
    white_bkg: false
    learnable_bkg_feat: false
    texture_map_dim: 3
    texture_map_res: 256
    interpolation_mode: "bilinear"
    padding_mode: "zeros"
    texture_map_act: Sigmoid
    texture_map_stop_uv_grad: false
    texture_map_stop_prob_grad: false
    train_argmax: false
    eval_argmax: false
    use_texture_map: true
    use_texture_mlp: false
    texture_map_init_func: "random"
    mlp:
      share_mlps: true
      use_rayd: true
      use_uv: true
      rayd_pe_degree: 4 # deprecated
      pe_degree: 8
      num_layers: 3
      hidden_dim: 128
      out_dim: 3
      act_type: ReLU
      last_act_type: Sigmoid
  additional_texture:
    use: false
    white_bkg: false
    learnable_bkg_feat: false
    texture_map_dim: 3
    texture_map_res: 256
    interpolation_mode: "bilinear"
    padding_mode: "zeros"
    texture_map_act: Sigmoid
    texture_map_stop_uv_grad: false
    texture_map_stop_prob_grad: false
    train_argmax: false
    eval_argmax: false
    use_texture_map: true
    use_texture_mlp: false
    texture_map_init_func: "zeros"
  sample:
    erode_fg_mask: false
    erode_kernel_size: 5
    erode_iterations: 1
    source: gt
    use_gt_surface_points: false
    bounding_box_mesh_path: null  # path to a bounding box mesh (cube with 8 vertices in 3D), used to filter surface points outside the box instead of using fg_mask
    papr_path: ""  # set per-scene; the archived value was a developer-local path
    papr_sample_radius: 4.0
    papr_sample_hemi: False
    data_path: "./data/nerf_synthetic/lego/"  # unused in this release
    split: train
    sp_fuse_type: projection
    noise: -1
    noise_pos_only: false
    noise_along: ray
    patch_size: 4
  train:
    skip_nan_grad: false
    iters: 40000
    G_num: 5120
    T_num: 5120
    V_num: 5120
    seed: 37
    texture_map_save_interval: 2000
    uv_visualization_interval: 2000
    val_views: [0, 19, 40]
    fix_keys: [
      # 'chart_assignment', 
      # 'texture_coordinate', 
      # 'surface_coordinate', 
      # 'sigma', 
      # 'texture_map',
      # 'texture_mlp'
    ]
    # Chart assignment warmup settings
    chart_assignment_warmup: false  # enable warmup training for chart assignment MLP
    chart_assignment_warmup_iters: 1000  # number of warmup iterations
    chart_assignment_warmup_batch_size: 4096  # batch size for warmup training
    chart_assignment_warmup_lr: 1.0e-3  # learning rate for warmup
    chart_assignment_warmup_log_interval: 100  # interval for logging warmup plots
    chart_assignment_warmup_kmeans_iters: 50  # number of K-means iterations
    chart_assignment_colored_pcd_path: null  # path to the colored point cloud for clustering
    # 6D clustering settings (positions + normals)
    chart_assignment_use_6d: false  # use 6D features (positions + normals) for clustering
    chart_assignment_clustering_init: "fps"  # initialization method: "fps" (farthest point sampling) or "sklearn" (auto-init)
    chart_assignment_normal_weight: 1.0  # weight for normals relative to positions in 6D clustering
    chart_assignment_normal_radius: null  # radius for normal estimation (null = auto)
    chart_assignment_normal_max_nn: 30  # max neighbors for normal estimation
    chart_assignment_knn_voting_k: 20  # number of neighbors for KNN voting cleanup (0 to disable)
    chart_assignment_knn_voting_iters: 3  # number of KNN voting iterations
    chart_assignment_sklearn_n_init: 10  # number of initializations for sklearn KMeans
    chart_assignment_sklearn_random_state: 42  # random seed for sklearn KMeans
    chart_assignment_max_steps: 1.0e+9
    texture_coordinate_max_steps: 1.0e+9
    surface_coordinate_max_steps: 1.0e+9
    sigma_max_steps: 1.0e+9
    texture_map_max_steps: 1.0e+9
    texture_mlp_max_steps: 1.0e+9
    texture_map_bkg_feat_max_steps: 1.0e+9
    additional_texture_map_max_steps: 1.0e+9
    additional_texture_mlp_max_steps: 1.0e+9
    additional_texture_map_bkg_feat_max_steps: 1.0e+9
  loss:
    three_two_three: 1
    two_three_two: 1
    entropy: 0.04
    surface: 10
    cluster: 0.5
    conformal: 0.0
    stretch: 0.0
    jacobian_conformal: 0.0
    jacobian_area_dirichlet: 0.0
    jacobian_area_logdet: 0.0
    texture_map: 1
    texture_map_tv: 0.0
    texture_map_loss_weight_warmup_start_step: 0
    texture_map_loss_weight_warmup_steps: 20000
    texture_map_loss_weight_warmup_type: linear
  optimizer:
    chart_assignment_lr: 1.0e-4
    texture_coordinate_lr: 1.0e-4
    surface_coordinate_lr: 1.0e-4
    sigma_lr: 0.1
    normal_grids_lr: 0.04
    rgb_grids_lr: 0.04
    texture_map_lr: 0.04
    unet_lr: 0.04
    texture_mlp_lr: 0.005
    additional_texture_map_lr: 0.02
    additional_texture_mlp_lr: 0.005
    texture_map_bkg_feat_lr: 0.02
    additional_texture_map_bkg_feat_lr: 0.02
